name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

            - name: Generate GitHub Stats
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=marames25&show_icons=true&hide_border=true&bg_color=00000000&title_color=FF3ED1&icon_color=FF3ED1&text_color=FFFFFF&ring_color=FF3ED1'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Most Used Languages Card
      # ------------------------------------------------------------

      - name: Generate Top Languages
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: username=marames25&layout=compact&hide_border=true&bg_color=00000000&title_color=FF3ED1&text_color=FFFFFF
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Commit generated cards
      # ------------------------------------------------------------

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub stats"
            git push
          fi
