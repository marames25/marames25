name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Generate GitHub Stats Cards
      # ------------------------------------------------------------

      - name: Generate GitHub Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request
          from collections import Counter
          from pathlib import Path
          from html import escape


          # ============================================================
          # Configuration
          # ============================================================

          USERNAME = "marames25"
          TOKEN = os.environ["GH_TOKEN"]


          # ============================================================
          # GitHub API
          # ============================================================

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "github-stats-generator"
          }


          def github_api(url):

              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:

                  return json.loads(
                      response.read().decode()
                  )


          # ============================================================
          # Get repositories
          # ============================================================

          print("Fetching repositories...")

          repos = []

          page = 1

          while True:

              url = (
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              data = github_api(url)

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1


          print(f"Found {len(repos)} repositories")


          # ============================================================
          # Repository statistics
          # ============================================================

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repos
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in repos
          )


          # ============================================================
          # Count languages
          # ============================================================

          languages = Counter()

          for repo in repos:

              language = repo.get("language")

              if language:
                  languages[language] += 1


          # ============================================================
          # Create output directory
          # ============================================================

          Path("profile").mkdir(
              parents=True,
              exist_ok=True
          )


          # ============================================================
          # GitHub Stats Card
          # ============================================================

          most_used_language = (
              languages.most_common(1)[0][0]
              if languages
              else "N/A"
          )


          stats_svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
            width="495"
            height="195"
            viewBox="0 0 495 195">

            <style>

              .title {{
                fill: #FF3ED1;
                font: 600 18px Arial, sans-serif;
              }}

              .label {{
                fill: #FFFFFF;
                font: 500 14px Arial, sans-serif;
              }}

              .value {{
                fill: #FFFFFF;
                font: 700 20px Arial, sans-serif;
              }}

            </style>


            <rect
              x="0"
              y="0"
              width="495"
              height="195"
              rx="12"
              fill="#000000"
              fill-opacity="0.35"
              stroke="#FF3ED1"
              stroke-opacity="0.35"/>


            <text
              x="25"
              y="35"
              class="title">

              Maram's GitHub Stats

            </text>


            <text
              x="25"
              y="75"
              class="label">

              Public Repositories

            </text>


            <text
              x="25"
              y="100"
              class="value">

              {len(repos)}

            </text>


            <text
              x="175"
              y="75"
              class="label">

              Stars

            </text>


            <text
              x="175"
              y="100"
              class="value">

              {stars}

            </text>


            <text
              x="300"
              y="75"
              class="label">

              Forks

            </text>


            <text
              x="300"
              y="100"
              class="value">

              {forks}

            </text>


            <text
              x="25"
              y="140"
              class="label">

              Most Used Language

            </text>


            <text
              x="25"
              y="165"
              class="value">

              {escape(most_used_language)}

            </text>


            <text
              x="175"
              y="140"
              class="label">

              Languages

            </text>


            <text
              x="175"
              y="165"
              class="value">

              {len(languages)}

            </text>


            <text
              x="300"
              y="140"
              class="label">

              Developer

            </text>


            <text
              x="300"
              y="165"
              class="value">

              {USERNAME}

            </text>

          </svg>'''


          Path(
              "profile/stats.svg"
          ).write_text(
              stats_svg,
              encoding="utf-8"
          )


          print("Generated profile/stats.svg")


          # ============================================================
          # Most Used Languages Card
          # ============================================================

          top_languages = languages.most_common(5)


          # GitHub Readme Stats language colors

          language_colors = {

              "Python": "#3572A5",
              "Java": "#b07219",
              "JavaScript": "#f1e05a",
              "TypeScript": "#3178c6",
              "C++": "#f34b7d",
              "C#": "#178600",
              "HTML": "#e34c26",
              "CSS": "#563d7c",
              "PHP": "#4F5D95",
              "Jupyter Notebook": "#DA5B0B",
              "Shell": "#89e051",
              "Go": "#00ADD8",
              "Kotlin": "#A97BFF",
              "Dart": "#00B4AB",
              "Ruby": "#701516",
              "Swift": "#F05138",
              "Rust": "#DEA584",
              "C": "#555555",
              "R": "#198CE7",
              "MATLAB": "#e16737",
              "Django": "#092E20"

          }


          # ============================================================
          # Calculate percentages
          # ============================================================

          total = sum(
              count
              for _, count in top_languages
          ) or 1


          # ============================================================
          # Language rows
          # ============================================================

          language_rows = ""


          y = 72


          for language, count in top_languages:

              percentage = (
                  count / total
              ) * 100


              color = language_colors.get(
                  language,
                  "#FF3ED1"
              )


              language_rows += f'''

                <circle
                  cx="30"
                  cy="{y - 5}"
                  r="5"
                  fill="{color}"/>


                <text
                  x="45"
                  y="{y}"
                  class="language">

                  {escape(language)}

                </text>


                <text
                  x="455"
                  y="{y}"
                  text-anchor="end"
                  class="percentage">

                  {percentage:.1f}%

                </text>

              '''


              y += 32


          # ============================================================
          # Most Used Languages SVG
          # ============================================================

          top_langs_svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
            width="495"
            height="230"
            viewBox="0 0 495 230">


            <style>

              .title {{
                fill: #FF3ED1;
                font: 600 18px Arial, sans-serif;
              }}

              .language {{
                fill: #FFFFFF;
                font: 500 13px Arial, sans-serif;
              }}

              .percentage {{
                fill: #C8A2FF;
                font: 500 13px Arial, sans-serif;
              }}

            </style>


            <rect
              x="0"
              y="0"
              width="495"
              height="230"
              rx="12"
              fill="#000000"
              fill-opacity="0.35"
              stroke="#FF3ED1"
              stroke-opacity="0.35"/>


            <text
              x="25"
              y="35"
              class="title">

              Most Used Languages

            </text>


            {language_rows}


          </svg>'''


          Path(
              "profile/top-langs.svg"
          ).write_text(
              top_langs_svg,
              encoding="utf-8"
          )


          print("Generated profile/top-langs.svg")


          PY

      # ------------------------------------------------------------
      # Commit generated cards
      # ------------------------------------------------------------

      - name: Commit generated cards
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add profile/stats.svg profile/top-langs.svg


          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit -m "Update GitHub stats"

            git push

          fi
